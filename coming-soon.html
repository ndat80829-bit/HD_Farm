<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HD Farm - Đang phát triển</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  .container { max-width: 600px; }
  .logo {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .badge {
    display: inline-block;
    background: rgba(74, 222, 128, 0.15);
    border: 1px solid #4ade80;
    color: #4ade80;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    margin-bottom: 30px;
    letter-spacing: 1px;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 16px;
    font-weight: 600;
  }
  p.desc {
    color: #cbd5e1;
    line-height: 1.6;
    margin-bottom: 30px;
    font-size: 1rem;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #4ade80;
    border-radius: 50%;
    margin: 0 auto 30px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .links {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .links a {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    text-decoration: none;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.9rem;
    transition: background 0.2s, transform 0.2s;
  }
  .links a:hover {
    background: rgba(255,255,255,0.18);
    transform: translateY(-2px);
  }
  footer {
    margin-top: 40px;
    color: #64748b;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">HD FARM</div>
    <span class="badge">🚧 ĐANG PHÁT TRIỂN</span>
    <div class="spinner"></div>
    <h1>Website đang được xây dựng</h1>
    <p class="desc">
      Trang web này hiện đang trong quá trình phát triển bởi đội ngũ <strong>HD Farm</strong>.
      Chúng tôi đang nỗ lực hoàn thiện để sớm mang đến trải nghiệm tốt nhất cho bạn. Vui lòng quay lại sau!
